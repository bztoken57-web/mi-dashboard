<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi Dashboard</title>
  <style>
    body {
      background-color: #0d1117;
      color: #e6edf3;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    h1 {
      color: #58a6ff;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #30363d;
      padding: 10px;
      text-align: left;
    }
    th {
      background-color: #161b22;
    }
    .long { color: #3fb950; font-weight: bold; }
    .short { color: #f85149; font-weight: bold; }
  </style>
</head>
<body>
  <h1>📊 Mi Dashboard - Bulls & Bears IA</h1>
  <table id="tabla-senales">
    <thead>
      <tr>
        <th>Par</th>
        <th>Tipo</th>
        <th>Entrada</th>
        <th>SL</th>
        <th>TP</th>
        <th>Estado</th>
      </tr>
    </thead>
    <tbody id="cuerpo-tabla">
      <tr><td colspan="6">Cargando señales...</td></tr>
    </tbody>
  </table>

  <script>
    const URL_DATOS = "https://raw.githubusercontent.com/bztoken57-web/bot-datos/main/senales.json";

    fetch(URL_DATOS)
      .then(res => res.json())
      .then(datos => {
        const cuerpo = document.getElementById("cuerpo-tabla");
        cuerpo.innerHTML = "";
        datos.forEach(s => {
          const clase = s.tipo === "LONG" ? "long" : "short";
          cuerpo.innerHTML += `
            <tr>
              <td>${s.par}</td>
              <td class="${clase}">${s.tipo}</td>
              <td>${s.entrada}</td>
              <td>${s.sl}</td>
              <td>${s.tp}</td>
              <td>${s.estado}</td>
            </tr>`;
        });
      })
      .catch(err => {
        document.getElementById("cuerpo-tabla").innerHTML =
          "<tr><td colspan='6'>Error cargando datos</td></tr>";
      });
  </script>
</body>
</html>
